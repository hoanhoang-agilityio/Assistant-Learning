[project]
name = "pt-ai-core"
version = "0.1.0"
description = "PT AI Core Deep Researcher — supervisor-orchestrated LangGraph fitness training & macro system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Orchestration
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=2.0,<4.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-mcp-adapters>=0.3,<1.0",
    "mcp>=1.9,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    # API & UI
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "streamlit>=1.40,<2.0",
    # Observability & evaluation
    "langfuse>=3.0,<4.0",
    "ragas>=0.3,<0.4.2",
    # Database
    "psycopg[binary,pool]>=3.2,<4.0",
    # Config & utilities
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "langchain-community>=0.3,<0.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/ui/app.py" = ["E402"]
