[project]
name = "pt-ai-core"
version = "0.1.0"
description = "PT AI Core Deep Researcher — supervisor-orchestrated LangGraph fitness training & macro system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # Orchestration
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=2.0,<4.0",
    # Required by langfuse.langchain.CallbackHandler, which
    # core/observability/langfuse.py imports at module scope. Previously present
    # only transitively via ragas; when ragas became an optional extra this had
    # to become explicit, or a production install cannot start the API.
    "langchain>=1.0,<2.0",
    "langchain-core>=1.0,<2.0",
    "langchain-openai>=1.0,<2.0",
    "langchain-anthropic>=1.0,<2.0",
    "langchain-mcp-adapters>=0.3,<1.0",
    "mcp>=1.9,<2.0",
    "langchain-text-splitters>=1.0,<2.0",
    # API & UI
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "streamlit>=1.40,<2.0",
    # Observability
    "langfuse>=3.0,<4.0",
    # Database
    "psycopg[binary,pool]>=3.2,<4.0",
    "sqlmodel>=0.0.22,<1.0",
    "alembic>=1.14,<2.0",
    # SQLAlchemy `Vector` column type for the knowledge base. The server-side
    # extension ships with the pgvector/pgvector image; this is the client half,
    # without which app.models.knowledge cannot declare its embedding column.
    "pgvector>=0.3,<0.5",
    # Auth. python-jose is the JWT implementation (not PyJWT) and bcrypt is used
    # directly rather than through passlib, whose bcrypt backend is unmaintained.
    "python-jose[cryptography]>=3.3,<4.0",
    "bcrypt>=4.2,<5.0",
    "email-validator>=2.2,<3.0",
    "slowapi>=0.1.9,<1.0",
    # Structured logging: app.core.logging binds user_id/session_id into a
    # contextvar so every log line inside a request carries them.
    "structlog>=24.4,<26.0",
    "asgi-correlation-id>=4.3,<5.0",
    # Config & utilities
    "pydantic-settings>=2.6,<3.0",
    "python-dotenv>=1.0,<2.0",
    "httpx>=0.28,<1.0",
    "langchain-community>=0.3,<0.4.2",
    "redis>=8.1.0",
    "cachetools>=7.1.4",
    # Reads data/knowledge/*.docx in scripts/seed_knowledge.py. A runtime rather
    # than a dev dependency because seeding the knowledge base is a deployment
    # step, exactly like scripts/seed_catalog.py.
    "python-docx>=1.1,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    # TestClient in tests/test_auth_flow.py needs httpx, already a runtime dep.
    "ruff>=0.8,<1.0",
    "pre-commit>=4.0,<5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `app` is both the ASGI entrypoint (app.main:app) and the Streamlit front end
# (app/ui/main.py).
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
