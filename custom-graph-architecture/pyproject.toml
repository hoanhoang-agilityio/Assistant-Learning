[project]
name = "custom-graph-architecture"
version = "0.1.0"
description = "Fitness coaching + knowledge QA assistant built as a single custom LangGraph state graph."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.14.0",
    # Auth. python-jose is the JWT implementation (not PyJWT) and bcrypt is used
    # directly rather than through passlib, whose bcrypt backend is unmaintained.
    # python-multipart is what lets the form-encoded login and refresh bodies parse.
    "bcrypt>=4.2,<5.0",
    "email-validator>=2.2,<3.0",
    "fastapi>=0.115.0",
    "httpx>=0.28,<1.0",
    "langchain>=1.3.15",
    "langchain-core>=1.6.0",
    "langchain-openai>=1.6.0",
    "langfuse>=4.13.2",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-postgres>=3.1.2",
    "llm-guard>=0.3.16",
    "openai>=1.54.0",
    "pgvector>=0.3.6",
    "psycopg[binary,pool]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.3,<4.0",
    "python-multipart>=0.0.20",
    "ragas>=0.4.3",
    "slowapi>=0.1.9",
    # The [asyncio] extra pulls in greenlet, which SQLAlchemy's async engine needs.
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlmodel>=0.0.22",
    "streamlit>=1.40,<2.0",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.31",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require real external services (DB, APIs)",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes - unused imports, undefined names
    "I",   # isort - import sorting
    "UP",  # pyupgrade - modernize syntax for Python 3.13
    "B",   # flake8-bugbear - common bugs and design issues
    "PL",  # Pylint - deeper semantic checks
]
ignore = [
    "E501",  # line too long - handled by formatter
    "PLR0913",
    "PLW0603",
]
fixable = ["ALL"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
# The local alembic/ directory otherwise makes ruff treat the installed package as
# first-party and sort `from alembic import context` in with the src imports.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLR2004", "B017"]   # allow assert in tests
"src/models/*" = ["UP006", "UP007"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
