[project]
name = "custom-graph-architecture"
version = "0.1.0"
description = "Fitness coaching + knowledge QA assistant built as a single custom LangGraph state graph."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "structlog>=24.4.0",
    "slowapi>=0.1.9",
    "tenacity>=9.0.0",
    "langgraph>=0.6.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "openai>=1.54.0",
    "psycopg[binary,pool]>=3.2.0",
    # The [asyncio] extra pulls in greenlet, which SQLAlchemy's async engine needs.
    "sqlalchemy[asyncio]>=2.0.36",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    "langfuse>=3.0.0",
    "llm-guard>=0.3.15",
    "ragas>=0.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# The local alembic/ directory otherwise makes ruff treat the installed package as
# first-party and sort `from alembic import context` in with the app imports.
known-third-party = ["alembic"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
